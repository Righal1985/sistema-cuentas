# 1. URL de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/banco_db

# 2. Usuario y password
spring.datasource.username=postgres
spring.datasource.password=Agus281119

# 3. Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate config (ddl-auto update crea las tablas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Muestra los valores reales que se envían en las consultas (?, ?)
logging.level.org.hibernate.orm.jdbc.bind=trace
# Muestra si hubo errores de transacciones
logging.level.org.springframework.transaction=debug
